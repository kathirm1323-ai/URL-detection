<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            width: 320px;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #121212;
            color: white;
            border-radius: 12px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1e1e1e, #111);
            padding: 1.5rem;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .logo { font-size: 1.5rem; margin-bottom: 5px; }
        .status-box {
            padding: 2rem;
            text-align: center;
        }
        .status-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .status-text {
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .url-display {
            font-size: 0.8rem;
            color: #888;
            word-break: break-all;
            margin-top: 10px;
            padding: 0 10px;
        }
        .footer {
            padding: 1rem;
            background: #1a1a1a;
            text-align: center;
            font-size: 0.75rem;
            color: #666;
        }
        .btn-scan {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-scan:hover { background: #1d4ed8; }
        
        /* State Styles */
        .status-REAL .status-text { color: #10b981; }
        .status-FAKE .status-text { color: #ef4444; }
        .status-SUSPICIOUS .status-text { color: #f59e0b; }
    </style>
</head>
<body class="status-UNKNOWN">
    <div class="header">
        <div class="logo">🛡️ GuardLink</div>
        <div style="font-size: 0.8rem; color: #888;">Real-time URL Security</div>
    </div>
    
    <div class="status-box" id="statusBox">
        <div class="status-icon" id="statusIcon">🔍</div>
        <div class="status-text" id="statusText">Scanning...</div>
        <div class="url-display" id="urlDisplay">Finding active tab...</div>
        <button class="btn-scan" id="rescanBtn">Re-scan Site</button>
    </div>

    <div class="footer">
        Powered by GuardLink AI Analysis
    </div>
    <script src="popup.js"></script>
</body>
</html>
